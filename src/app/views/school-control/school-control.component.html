<!-- TODO: eliminar este banner cuando se confirme que el login funciona -->
<div *ngIf="user" style="background:#e8f5e9;border:1px solid #a5d6a7;padding:12px 16px;margin-bottom:16px;border-radius:6px;font-family:monospace;font-size:13px">
  <strong>Sesión activa</strong><br>
  Nombre: {{ user.name }}<br>
  Usuario: {{ user.username }}<br>
  Rol: {{ user.role }}<br>
  <button (click)="logout()" style="margin-top:8px">Cerrar sesión</button>
</div>

<h3>Área de control escolar</h3>

<!-- <app-login/> -->
<section>
    <p>Bienvenido</p>

    <div
        class="box-options"
        *ngIf="!isNewCourse && !isEditCourse && !isDeleteCourse">
        <button (click)="btnShowSelected('Add')">Agregar Nuevo Curso</button>
        <button (click)="btnShowSelected('Edit')">Editar Curso</button>
        <button (click)="btnShowSelected('Delete')" class="button-deleted">Eliminar Curso</button>
        <button *ngIf="canManageUsers()" routerLink="/admin-usuarios">Administrar Usuarios</button>
    </div>
</section>

<app-new-course-form 
    (closeNewCourseForm)="closeNewCourseForm($event)"
    *ngIf="isNewCourse"
>
</app-new-course-form>

<app-edit-course-form *ngIf="isEditCourse"></app-edit-course-form>

<app-delete-course *ngIf="isDeleteCourse"></app-delete-course>
