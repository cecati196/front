<div *ngIf="user" class="session-header">
  <span class="session-header__greeting">Hola, {{ user.name }}</span>
  <div class="session-header__actions">

    <button class="btn-icon" routerLink="/actualizar-contrasena" title="Cambiar contraseña">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>

    <button class="btn-icon btn-icon--logout" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>

  </div>
</div>

<h3>Área de control escolar</h3>

<section>
    <p>Selecciona una opción:</p>

    <div
        class="box-options"
        *ngIf="!isNewCourse && !isEditCourse && !isCatalogManager">
        <button (click)="btnShowSelected('Add')">Agregar Nuevo Curso</button>
        <button (click)="btnShowSelected('Edit')">Editar / Eliminar Curso</button>
        <button (click)="openCatalogManager()">Editar Especialidades y Profesores</button>
        <button *ngIf="canManageUsers()" routerLink="/admin-usuarios">Administrar Usuarios</button>
    </div>
</section>

<app-new-course-form 
    (closeNewCourseForm)="closeNewCourseForm($event)"
    *ngIf="isNewCourse"
>
</app-new-course-form>

<app-edit-course-form
    *ngIf="isEditCourse"
    (closeEditCourseForm)="closeEditCourseForm($event)">
</app-edit-course-form>

<app-catalog-manager
    *ngIf="isCatalogManager"
    (closeCatalogManager)="onCloseCatalogManager()">
</app-catalog-manager>
