<div class="change-password-container">
  <h2>Bienvenido, {{ username }}</h2>
  <p>Es tu primer inicio de sesión. Debes establecer una contraseña propia antes de continuar.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="currentPassword">Contraseña temporal</label>
    <input
      id="currentPassword"
      type="password"
      formControlName="currentPassword"
      placeholder="Ingresa la contraseña temporal"
      autocomplete="current-password"
    />

    <label for="newPassword">Nueva contraseña</label>
    <input
      id="newPassword"
      type="password"
      formControlName="newPassword"
      placeholder="Mínimo 8 caracteres"
      autocomplete="new-password"
    />

    <label for="confirmPassword">Confirmar nueva contraseña</label>
    <input
      id="confirmPassword"
      type="password"
      formControlName="confirmPassword"
      placeholder="Repite la nueva contraseña"
      autocomplete="new-password"
    />

    <p class="error-msg" *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.dirty">
      Las contraseñas no coinciden
    </p>
    <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

    <button type="submit" [disabled]="loading || form.invalid">
      {{ loading ? 'Guardando...' : 'Establecer contraseña' }}
    </button>
  </form>
</div>
