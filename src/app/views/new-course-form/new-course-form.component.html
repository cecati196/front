<div class="container-new-course-form">
    <p class="message">Registra un nuevo curso para el Sitio web:</p>
    <form [formGroup]="courseForm" id="addCourse" (submit)="addNewCourse()">
        <label for="specialty">
            <span class="required">Especialidad.</span>
            <select formControlName="specialty">
                <option *ngFor="let name of listSpecialties" [ngValue]="name">
                    {{ name }}
                </option> 
            </select>
        </label>
        
        <label for="courseName">
            <span class="required">Nombre del curso:</span>
            <input type="text" name="courseName" formControlName="courseName">
        </label>
    
        <label for="courseType">
            <span class="required">Tipo de Curso:</span>
            <select name="courseType" formControlName="courseType">
                <option *ngFor="let type of typeCourse" [ngValue]="type">
                    {{ type }}
                </option> 
            </select>
        </label>
    
        <label for="professor">
            <span class="required">Profesor:</span>
            <input list="professor" name="professor" formControlName="professor">
            <datalist id="professor">
                <option *ngFor="let professor of listProfesor" [ngValue]="professor">
                    {{ professor }}
                </option>  
            </datalist>
        </label>
    
        <label for="startDate">
            <span class="required">Fecha de Inicio del curso:</span>
            <input type="date" name="startDate" formControlName="startDate">
        </label>
        <label for="endDate">
            <span class="required">Fecha de Termino del curso:</span>
            <input type="date" name="endDate" formControlName="endDate">
        </label>
    
        <label for="courseModality">
            <span class="required">Modalidad:</span>
            <select name="courseModality" formControlName="courseModality">
                <option *ngFor="let type of typesModality" [ngValue]="type">
                    {{ type }}
                </option>
            </select>
        </label>
    
        <label for="daysOfClasses" class="days-of-classes">
            <span class="required">Dias de Clase:</span>
            <div>
                <input type="checkbox" name="dia[]" value="Lunes" onclick="estado();"/><span>Lunes</span>
                <input type="checkbox" name="dia[]" value="Martes" onclick="estado();"/><span>Martes</span>
                <input type="checkbox" name="dia[]" value="Miercoles" onclick="estado();"/><span>Miércoles</span>
                <input type="checkbox" name="dia[]" value="Jueves" onclick="estado();"/><span>Jueves</span>
                <input type="checkbox" name="dia[]" value="Viernes" onclick="estado();"/><span>Viernes</span>
                <input type="checkbox" name="dia[]" value="Sábado" onclick="estado();"/><span>Sábado</span>
                <input type="checkbox" name="dia[]" value="Domingo" onclick="estado();"/><span>Domingo</span>
                <input type="checkbox" name="dia[]" value="Lun-Vie" onclick="estado();"/><span>Lun-Vie</span>
            </div>
            <p>Aqui van los dias select</p>
            <!-- <select name="daysOfClasses" formControlName="daysOfClasses">
                <option *ngFor="let days of daysOfClass" [ngValue]="days">
                    {{ days }}
                </option>
            </select> -->
        </label>
    
        <label for="startTime">
            <span class="required">Horario de clases. Inicia:</span>
            <input type="time" name="startTime" id="" formControlName="startTime">
        </label>
    
        <label for="endTime">
            <span class="required">Horario de clases. Termina:</span>
            <input type="time" name="endTime" id="" formControlName="endTime">
        </label>

        <label for="hours">
            <span class="required">Total de HORAS del curso:</span>
            <input type="number" name="hours" formControlName="hours">
        </label>
    
        <label for="cost">
            <span class="required">Costo:</span>
            <div class="cost-row">
                <span class="form-cost"></span>
                <input type="number" name="cost" formControlName="cost">
            </div>
        </label>
    
        <label for="objective" class="full-width">
            <span>Objetivo:</span>
            <textarea name="objective" formControlName="objective">
            </textarea>
        </label>

        <label for="thematicContent" class="full-width">
            <span>Contenido Temático:</span>
            <textarea name="thematicContent" cols="30" rows="10" formControlName="thematicContent">
            </textarea>
        </label>

        <label for="observations" class="full-width">
            <span>Observaciones:</span>
            <textarea name="observations" cols="30" rows="10" formControlName="observations">
            </textarea>
        </label>

        <label for="searchPhrase" class="full-width">
            <span>Palabra o Frase de Busqueda:</span>
            <div class="search-phrase-row">
                <input type="text" name="searchPhrase" #inputPhrase [value]="phareInput">
                <button type="button" (click)="newPhrase(inputPhrase.value)">Añadir palabra</button>
            </div>
            <p >{{ phrases.toString() }}</p>
        </label>
        
        <p class="legend-required">* Campos Obligatorios</p>
    </form>
    <div class="container-buttons">
        <button 
            class="cancel"
            (click)="cancelAddCourse()"
        >
        CANCELAR Y REGRESAR
        </button>
        <button type="submit" form="addCourse">
            Registrar Curso
        </button>
    </div>
</div>
